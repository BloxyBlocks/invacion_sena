<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07100b" />
    <link rel="icon" type="image/png" href="/assets/img/icons/icon.png" />
    <meta
      name="description"
      content="INVACIÓN SENA: juego web 2D de supervivencia ambientado en el SENA."
    />
    <title>INVACIÓN SENA</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #07100b;
      }

      body {
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
        touch-action: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Juego INVACIÓN SENA"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
